name: formal-linux

on:
  push:
  pull_request:

jobs:
  python-310-offline-formal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install locked project and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --constraint requirements-lock.txt ".[dev]"
      - name: Static and test gates
        run: |
          python -m compileall .
          ruff check .
          mypy mathforge user_agent.py
          pytest -q
      - name: Governance gates
        run: |
          python scripts/scan_secrets.py
          python scripts/verify_baseline_files.py
          python scripts/verify_build_provenance.py
          python scripts/validate_submission.py
      - name: Runtime network-denial smoke
        run: python scripts/formal_offline_smoke.py
